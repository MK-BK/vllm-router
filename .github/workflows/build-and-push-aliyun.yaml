name: Build and Push to Aliyun ACR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    # 注意：GitHub UI 会自动显示 "Use workflow from" 下拉框，
    # 可直接选择任意 branch 或 tag，无需额外参数
    inputs:
      image_tag:
        description: 'Docker image tag (默认使用输入值，留空则自动生成)'
        required: false
        default: ''
      platforms:
        description: 'Build platform(s)'
        required: true
        default: 'linux/amd64'
      push_image:
        description: 'Push image to Aliyun ACR'
        required: true
        default: true
        type: boolean
      use_cache:
        description: 'Use GitHub Actions build cache'
        required: true
        default: true
        type: boolean

env:
  REGISTRY: crpi-pweus896l7j9p1b9.cn-hangzhou.personal.cr.aliyuncs.com
  NAMESPACE: images_dev
  IMAGE_NAME: vllm-router

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        # workflow_dispatch 时，github.ref 已包含用户从 UI 选择的 branch/tag
        # 无需额外指定 ref

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        if: github.event.inputs.push_image != 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Determine image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            # 手动触发时优先使用用户输入的 tag
            TAG="${{ github.event.inputs.image_tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            # git tag push 时使用 tag 名
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # branch push 时使用 commit short sha
            TAG="${GITHUB_SHA::8}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "full_image=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${TAG}" >> $GITHUB_OUTPUT

      - name: Set cache options
        id: cache
        run: |
          if [ "${{ github.event.inputs.use_cache }}" = "false" ]; then
            echo "cache_from=" >> $GITHUB_OUTPUT
            echo "cache_to=" >> $GITHUB_OUTPUT
          else
            echo "cache_from=type=gha" >> $GITHUB_OUTPUT
            echo "cache_to=type=gha,mode=max" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.router
          push: ${{ github.event.inputs.push_image != 'false' }}
          tags: ${{ steps.meta.outputs.full_image }}
          cache-from: ${{ steps.cache.outputs.cache_from }}
          cache-to: ${{ steps.cache.outputs.cache_to }}
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}

      - name: Print image info
        run: |
          echo "======================================"
          echo "Branch/Tag: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Image: ${{ steps.meta.outputs.full_image }}"
          echo "======================================"
